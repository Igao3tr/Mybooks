<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Leituras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">L</div>
        <div>
          <strong>Minhas Leituras</strong>
          <span>diário de livros</span>
        </div>
      </div>

      <nav>
        <a class="nav-item active" href="#biblioteca" data-view="biblioteca">
          <span>▦</span> Biblioteca
        </a>
        <a class="nav-item" href="#novo" data-view="novo">
          <span>＋</span> Adicionar livro
        </a>
      </nav>

      <div class="sidebar-footer">
        <span id="connection-dot" class="status-dot"></span>
        <span id="connection-text">Conectando...</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">SEU ACERVO</p>
          <h1 id="page-title">Biblioteca</h1>
        </div>
        <button class="primary-btn" id="new-book-btn">+ Adicionar livro</button>
      </header>

      <section id="biblioteca-view" class="view active-view">
        <div class="stats">
          <div class="stat-card">
            <span>Total de livros</span>
            <strong id="total-count">—</strong>
          </div>
          <div class="stat-card">
            <span>Lendo agora</span>
            <strong id="reading-count">—</strong>
          </div>
          <div class="stat-card">
            <span>Concluídos</span>
            <strong id="finished-count">—</strong>
          </div>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            <span>⌕</span>
            <input id="search" type="search" placeholder="Buscar por título ou ISBN..." />
          </div>
          <select id="filter">
            <option value="todos">Todos</option>
            <option value="lendo">Lendo</option>
            <option value="concluidos">Concluídos</option>
            <option value="nao-iniciados">Não iniciados</option>
          </select>
        </div>

        <div id="books" class="book-list"></div>
        <div id="empty" class="empty-state hidden">
          <div class="empty-icon">◌</div>
          <h2>Nenhum livro encontrado</h2>
          <p>Adicione seu primeiro livro ou ajuste a busca.</p>
          <button class="secondary-btn" id="empty-new-btn">Adicionar livro</button>
        </div>
      </section>

      <section id="novo-view" class="view">
        <div class="form-card">
          <div class="form-heading">
            <p class="eyebrow">NOVA LEITURA</p>
            <h2>Adicionar livro</h2>
            <p>Registre uma leitura. O ISBN é opcional.</p>
          </div>
          <form id="book-form">
            <label>
              Nome do livro <span>*</span>
              <input id="nome_livro" name="nome_livro" required maxlength="255" placeholder="Ex.: O Som e a Fúria" />
            </label>

            <label>
              ISBN <small>(opcional)</small>
              <input id="isbn" name="isbn" inputmode="numeric" maxlength="13" placeholder="978..." />
            </label>

            <div class="date-grid">
              <label>
                Data de início <small>(opcional)</small>
                <input id="data_inicio" name="data_inicio" type="date" />
              </label>
              <label>
                Data de término <small>(opcional)</small>
                <input id="data_fim" name="data_fim" type="date" />
              </label>
            </div>

            <div class="form-actions">
              <button type="button" class="secondary-btn" id="cancel-btn">Cancelar</button>
              <button type="submit" class="primary-btn" id="save-btn">Salvar livro</button>
            </div>
            <p id="form-message" class="form-message"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <template id="book-template">
    <article class="book-card">
      <div class="book-cover"><span>BOOK</span></div>
      <div class="book-info">
        <div class="book-title-row">
          <h3 class="book-title"></h3>
          <button class="delete-btn" title="Excluir livro" aria-label="Excluir livro">×</button>
        </div>
        <div class="book-meta"></div>
        <div class="progress-row">
          <span class="status-badge"></span>
          <span class="dates"></span>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
