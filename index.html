<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Leituras — Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f7f5f0;
            color: #242321;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: #252422;
            color: #f7f5f0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 25px;
            font-weight: bold;
        }

        .logo-text {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.2;
        }

        .logo-text span {
            display: block;
            margin-top: 3px;
            color: #817d76;
            font-size: 12px;
            font-weight: normal;
        }

        .card {
            background: #fffdf9;
            border: 1px solid #dfdcd5;
            border-radius: 15px;
            padding: 38px 30px 32px;

            box-shadow: 0 2px 8px rgba(40, 38, 34, 0.03);
        }

        .eyebrow {
            color: #8a857c;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #242321;
        }

        .description {
            color: #817d76;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: #dedbd4;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 14px;

            border: 1px solid #d8d5ce;
            border-radius: 8px;
            background: #fffefa;

            color: #292825;
            font-size: 14px;

            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus {
            border-color: #817d76;
            box-shadow: 0 0 0 3px rgba(129, 125, 118, 0.10);
        }

        .password-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot {
            color: #6f6b64;
            text-decoration: none;
            font-size: 12px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            height: 46px;
            margin-top: 4px;

            border: none;
            border-radius: 9px;

            background: #252422;
            color: #fffdf9;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .login-button:hover {
            background: #363430;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #817d76;
            font-size: 13px;
        }

        .register a {
            color: #252422;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #aaa69e;
            font-size: 11px;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 16px;
            }

            .card {
                padding: 30px 22px 26px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">
            <div class="logo-icon">L</div>

            <div class="logo-text">
                Minhas Leituras
                <span>diário de livros</span>
            </div>
        </div>

        <section class="card">

            <div class="eyebrow">BEM-VINDO DE VOLTA</div>

            <h1>Entrar</h1>

            <p class="description">
                Acesse sua biblioteca e continue suas leituras.
            </p>

            <div class="divider"></div>

            <form id = "login-form">

                <div class="field">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">

                    <div class="password-header">
                        <label for="senha">Senha</label>

                        <a href="#" class="forgot">
                            Esqueci minha senha
                        </a>
                    </div>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit" class="login-button" id="sub">
                    Entrar
                </button>

            </form>

            <p class="register">
                Ainda não possui uma conta?
                <a href="#">Criar conta</a>
            </p>

        </section>

        <p class="footer">
            Minhas Leituras · seu acervo pessoal
        </p>

    </main>
<script type ="module" src="app.js"></script>
</body>
</html>
